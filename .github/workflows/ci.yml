name: Test and build Windows
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run check
      - run: npm run test:ui
      - run: npm run test:language
      - run: npm run test:reset
      - run: npm run build
      - run: node scripts/verify-package.cjs
      - name: Verify packaged language switching
        shell: pwsh
        run: |
          $env:DASHBOARD_TEST_EXE = Join-Path $PWD 'dist/win-unpacked/Codex Reset Dashboard.exe'
          npm run test:language
      - name: Verify packaged reset lifecycle
        shell: pwsh
        run: |
          $env:DASHBOARD_TEST_EXE = Join-Path $PWD 'dist/win-unpacked/Codex Reset Dashboard.exe'
          npm run test:reset
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installers
          path: dist/*.exe
          if-no-files-found: error
