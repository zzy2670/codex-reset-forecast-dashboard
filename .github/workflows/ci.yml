name: Test and build Windows
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run check
      - run: npm run test:ui
      - run: npm run test:language
      - run: npm run test:reset
      - run: npm run test:onboarding
      - run: npm run test:local-pace
      - run: npm run test:calendar-reset
      - run: npm run test:timezone
      - run: npm run test:calendar
      - run: npm run test:quota-history
      - run: npm run build
      - run: node scripts/verify-package.cjs
      - name: Install release on a clean Windows runner
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem dist/*Setup*-x64.exe)
          if ($installer.Count -ne 1) { throw 'Expected one setup executable' }
          $installDir = Join-Path $env:RUNNER_TEMP 'Codex Dashboard First Install'
          $setup = Start-Process -FilePath $installer[0].FullName -ArgumentList "/S /currentuser /D=$installDir" -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Silent installation failed' }
          if (-not (Test-Path -LiteralPath (Join-Path $installDir 'Codex Reset Dashboard.exe'))) { throw 'Installed executable missing' }
      - name: Verify packaged first-run connection
        shell: pwsh
        run: |
          $env:DASHBOARD_TEST_EXE = Join-Path $env:RUNNER_TEMP 'Codex Dashboard First Install/Codex Reset Dashboard.exe'
          npm run test:onboarding
      - name: Verify installed official reset calendar clearing
        shell: pwsh
        run: |
          $env:DASHBOARD_TEST_EXE = Join-Path $env:RUNNER_TEMP 'Codex Dashboard First Install/Codex Reset Dashboard.exe'
          npm run test:calendar-reset
      - name: Verify installed local refill pacing
        shell: pwsh
        run: |
          $env:DASHBOARD_TEST_EXE = Join-Path $env:RUNNER_TEMP 'Codex Dashboard First Install/Codex Reset Dashboard.exe'
          npm run test:local-pace
      - name: Verify installed timezone
        shell: pwsh
        run: |
          $env:DASHBOARD_TEST_EXE = Join-Path $env:RUNNER_TEMP 'Codex Dashboard First Install/Codex Reset Dashboard.exe'
          npm run test:timezone
      - name: Verify installed calendar and target settings
        shell: pwsh
        run: |
          $env:DASHBOARD_TEST_EXE = Join-Path $env:RUNNER_TEMP 'Codex Dashboard First Install/Codex Reset Dashboard.exe'
          npm run test:calendar
      - name: Verify deployment without an external CLI or sign-in
        shell: pwsh
        run: |
          $env:DASHBOARD_TEST_EXE = Join-Path $env:RUNNER_TEMP 'Codex Dashboard First Install/Codex Reset Dashboard.exe'
          npm run test:deployment
      - name: Verify packaged language switching
        shell: pwsh
        run: |
          $env:DASHBOARD_TEST_EXE = Join-Path $env:RUNNER_TEMP 'Codex Dashboard First Install/Codex Reset Dashboard.exe'
          npm run test:quota-history
          npm run test:language
      - name: Verify packaged reset lifecycle
        shell: pwsh
        run: |
          $env:DASHBOARD_TEST_EXE = Join-Path $env:RUNNER_TEMP 'Codex Dashboard First Install/Codex Reset Dashboard.exe'
          npm run test:reset
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installers
          path: dist/*.exe
          if-no-files-found: error
